name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app sample_api demo tests

      - name: Run unit + integration tests (fully offline: SQLite + fakeredis + in-process ASGI)
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Verify Docker image builds
        if: matrix.python-version == '3.11'
        run: docker build -t agentgate:ci .
